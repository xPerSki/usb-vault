[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usb-vault"
version = "0.1.0"
description = "A hardware-key encrypted file vault using USB device fingerprinting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "cryptography>=42.0",      # AES-GCM, HKDF
    "argon2-cffi>=23.1",       # Argon2id KDF
    "typer[all]>=0.12",        # CLI framework
    "rich>=13.0",              # Terminal formatting
    "pywin32>=306",            # Windows USB enumeration (WMI)
    "wmi>=1.5.1",              # WMI wrapper for USB queries
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
usb-vault = "usb_vault.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "D", "I", "S", "N", "ANN"]
ignore = ["D100", "S101", "S105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "S101", "S105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
