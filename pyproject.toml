[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usb-vault"
dynamic = ["version"]
description = "A hardware-key encrypted file vault using USB device fingerprinting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }

dependencies = [
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "click>=8.1",
    "rich>=13.0",
    "pywin32>=306",
    "wmi>=1.5.1",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.5",
]

[project.scripts]
usb-vault = "usb_vault.cli:cli"

[project.gui-scripts]
usb-vault-webui = "usb_vault.webui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "usb_vault.__version__" }

[tool.setuptools.package-data]
"usb_vault" = ["icons/icon.ico"]
"usb_vault.webui" = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "D", "I", "S", "N", "ANN"]
ignore = ["D100", "S101", "S105", "S106", "E501", "ANN101", "ANN102"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "S101", "S105", "S106", "E501"]
"scripts/*" = ["D", "ANN", "S101", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
